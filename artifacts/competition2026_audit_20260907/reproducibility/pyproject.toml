[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gridrescue"
version = "0.1.0"
description = "Low-carbon resilient distribution-grid restoration digital twin"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.0",
  "networkx>=3.2",
  "cvxpy>=1.4",
  "streamlit>=1.30",
  "plotly>=5.18",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

